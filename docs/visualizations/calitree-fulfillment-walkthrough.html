<script>

    locally_robust:'Locally robust · all gates passed',stable_but_mismatched:'Consistent prediction · wrong reference label',

    confirmation_missing_or_unqualified:'Confirmation missing or unqualified',requirement_instability:'Requirement decisions varied',
    confirmation_qualified:'Confirmation gates passed',round_limit:'Repair-round limit reached'
  })[v] || (v.startsWith('node_instability:') ? 'Variable decisions at '+v.split(':')[1] : v)).join(' · ');
  const escape = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    if(i<0) return;
    ci=i;
    const j=data.cases[ci].steps.findIndex(t=>t.key===s.step_key);

  }

    el('cff-runs').innerHTML=traces.map((tr,i)=>'<button type="button" class="btn cff-run" data-draw="'+i+'" aria-pressed="'+(i===di)+'">Run '+(i+1)+' · '+escape(label(tr.label))+'</button>').join('');
    if(rep?.recovery) {
      el('cff-runs').innerHTML+='<label class="form-check"><input type="checkbox" class="form-check-input" id="cff-raw" '+(raw?'checked':'')+'><span class="form-check-label">Before transport recovery</span></label>';
      el('cff-raw').addEventListener('change',e=>{raw=e.target.checked;render();remember();});
    }
    root.querySelectorAll('.cff-run').forEach(b=>b.addEventListener('click',()=>{di=Number(b.dataset.draw);render();remember();}));
    if(t) {
      const f=t.fulfillment;
      const value=Number.isFinite(f.score)?percent(f.score):f.lower==null?'Unmeasured':percent(f.lower)+'–'+percent(f.upper);
      const match=t.label===c.reference;
      el('cff-aggregate').innerHTML='<div class="cff-aggregate-grid"><div><div class="text-small">Overall fulfillment'+(f.score==null?' range':'')+'</div><div class="viz-stat-value tabular-nums">'+escape(value)+'</div></div><div><div class="text-small">Final aggregation label</div><div class="viz-stat-value">'+escape(label(t.label))+'</div></div><div><div class="text-small">Compared with reference</div><div class="viz-stat-value">'+(match?'Match':t.label==null?'Unresolved':'Mismatch')+'</div></div></div>';
    } else {
      el('cff-aggregate').innerHTML='<div class="text-small">Execution result</div><div class="viz-stat-value">'+(s.kind==='rejected'?'Proposal rejected':s.kind==='duplicate'?'Duplicate; not re-executed':'Not executed')+'</div><div>'+escape(s.reason||'No saved model observation')+'</div>';
    }
    el('cff-questions').innerHTML=nodes.length ? nodes.map(n=>{
      const o=t?.observations.find(o=>o.check_id===n.id);
      const score=o?.fulfillment_score,confidence=o?.confidence;
      const w=n.weight_numerator==null?null:n.weight_numerator/n.weight_denominator;
      const scoreLabel=!o?'Not measured':score==null?'Unmeasured':score>=.9?'Satisfied component':score<=.1?'Nonsatisfied component':'Partial component';
      const metric=(title,v)=>'<div><div class="cff-label-line"><span>'+title+'</span><span class="tabular-nums">'+percent(v)+' <span class="text-small">('+fraction(v)+')</span></span></div>'+(Number.isFinite(v)?'<div class="progress" role="progressbar" aria-label="'+title+'" aria-valuenow="'+(v*100)+'" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:'+(v*100)+'%"></div></div>':'<span class="text-small text-muted">No numerical estimate</span>')+'</div>';
      return '<div class="cff-question"><div class="viz-row"><span class="viz-badge">'+escape(n.id)+'</span><span class="text-small">'+(w==null?'Weight not constructed':n.role==='evidence'?'Auxiliary · zero weight':'Weight '+percent(w))+'</span><span>'+escape(scoreLabel)+'</span></div><div class="cff-question-title cff-space">'+escape(n.question)+'</div><div class="cff-measures">'+metric('Estimated fulfillment',score)+metric('Reported confidence',confidence)+'</div><button class="btn btn-ghost cff-inspect" type="button" data-check="'+escape(n.id)+'" aria-pressed="'+(n.id===checkId)+'">'+(n.id===checkId?'Showing evidence and anchors':'Show evidence and anchors')+'</button></div>';
    }).join('') : '<div>No executable check was proposed.</div>';
    root.querySelectorAll('.cff-inspect').forEach(b=>b.addEventListener('click',()=>{checkId=b.dataset.check;render();remember();}));
    const n=nodes.find(n=>n.id===checkId),o=t?.observations.find(o=>o.check_id===checkId);
    let info='';
    if(n) {
      info='<h3>'+escape(n.id)+' · observation details</h3>'+field('Observed event',friendly(o?.event||'No execution'))+field('Evidence',o?.evidence||'No model evidence was produced for this proposal');
      if(o?.attempts) info+='<details class="cff-space"><summary>Transport attempts · '+o.attempts.length+'</summary><div class="cff-detail">'+o.attempts.map((a,i)=>field('Attempt '+(i+1),friendly(a.event)+' · fulfillment '+percent(a.fulfillment_score)+' · confidence '+percent(a.confidence))).join('')+'</div></details>';
      info+='<details class="cff-space"><summary>Saved anchors, binding and provenance</summary><div class="cff-detail">'+field('0 · none',n.zero_when)+field('0.5 · half',n.half_when)+field('1 · complete',n.full_when)+field('Endpoint',n.endpoint)+field('Criteria',n.criteria)+field('Binding',n.binding)+field('Source quote',n.source_quote)+field('Necessity',n.necessity)+'</div></details>';
    }
    el('cff-inspector').innerHTML=info;
    const gate=rep?.confidence_pass;
    el('cff-rules').innerHTML=field('Instruction',c.instruction)+field('Reference',label(c.reference))+field('Stage rule',s.rule)+field('Label bands','≥90% satisfied · ≤10% nonsatisfied · between: partial')+field('Saved results',rep?Math.round(rep.agreement*rep.draws)+' / '+rep.draws+' matches · '+Math.round(rep.coverage*rep.draws)+' / '+rep.draws+' resolved':'No measurement')+field('Confidence gate',gate===undefined?'Not assessed':gate?'Passed on saved report':'Failed on saved report')+field('Final case status',friendly(c.status))+field('Program identity',s.program.ref||'No executable program');
    const hasProposal=Boolean(s.proposal_reason||s.feedback||s.actions||s.predictions);
    el('cff-proposal-details').hidden=!hasProposal;
    el('cff-proposal').innerHTML=(s.actions?field('Actions',s.actions.map(a=>a.operation+(a.target?' '+a.target:'')).join(' · ')):'')+(s.proposal_reason?field('Proposer reason',s.proposal_reason):'')+(s.predictions?field('Predicted scores',s.predictions.map(p=>p.decision_id+': '+percent(p.fulfillment_score)+' — '+p.evidence_reason).join('\n')):'')+(s.feedback?Object.entries(s.feedback).map(([k,v])=>field('Feedback '+k+' · excerpt',v)).join(''):'');
  }
  el('cff-case').addEventListener('change',e=>{ci=Number(e.target.value);si=di=0;raw=false;checkId='';populateCase();render();remember();});
  el('cff-step').addEventListener('change',e=>{si=Number(e.target.value);di=0;raw=false;checkId='';render();remember();});
  function changeCase(delta){ci=Math.max(0,Math.min(data.cases.length-1,ci+delta));si=di=0;raw=false;checkId='';populateCase();render();remember();}
  function changeStep(delta){si=Math.max(0,Math.min(data.cases[ci].steps.length-1,si+delta));di=0;raw=false;checkId='';render();remember();}
  el('cff-prev-case').addEventListener('click',()=>changeCase(-1));el('cff-next-case').addEventListener('click',()=>changeCase(1));
  el('cff-prev').addEventListener('click',()=>changeStep(-1));el('cff-next').addEventListener('click',()=>changeStep(1));
  applyState(window.openai?.widgetState);populateCase();render();
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(s){applyState(s);populateCase();render();}});
})();
</script>
