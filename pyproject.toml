[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vejudge"
version = "0.1.0"
description = "Calibrated LLM/VLM-as-a-judge pipeline for video editing outputs, with a human-vs-judge agreement-gap benchmark."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
vejudge-bench = "vejudge.benchmark.cli:main"
vejudge-robust = "vejudge.benchmark.robust:main"
vejudge-eval = "vejudge.workflow.pipeline:main"
vejudge-smoke = "vejudge.lm_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vejudge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
