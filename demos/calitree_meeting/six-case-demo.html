<body><main id="six-app"></main><script>/* Shared, dependency-free node/edge rule-tree view. Never changes a policy. */
(() => {
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['No','Partial','Yes'];
const views=new Map(),bound=new WeakSet();
function nodesFor(tree){const nodes=[],edges=[];let leaf=0,maxDepth=0;
  function walk(node,id,depth){const n={id,node,depth,number:nodes.length+1};nodes.push(n);maxDepth=Math.max(depth,maxDepth);
    if(node.feature){const t=walk(node.true,id+'T',depth+1),f=walk(node.false,id+'F',depth+1);n.x=(t.x+f.x)/2;edges.push({from:n,to:t,value:true},{from:n,to:f,value:false});}
    else n.x=leaf++*194+106;
    n.y=depth*140+28;n.h=node.feature?82:53;return n;}
  walk(tree,'r',0);return {nodes,edges,width:Math.max(240,leaf*194+18),height:(maxDepth+1)*140+8};
}
function route(tree,values,maxTests=Infinity){const ids=new Set(),edges=new Set();
  function walk(node,id,tests){ids.add(id);if(!node.feature||tests>=maxTests)return;const value=values?.[node.feature];
    for(const b of value==='unknown'?[true,false]:typeof value==='boolean'?[value]:[]){edges.add(id+(b?'T':'F'));walk(node[b?'true':'false'],id+(b?'T':'F'),tests+1);}}
  walk(tree,'r',0);return {ids,edges};}
function wrap(text,width=23){const lines=[];let line='';for(const w of String(text).split(/\s+/)){if((line+' '+w).trim().length>width&&line){lines.push(line);line=w;}else line=(line+' '+w).trim();}if(line)lines.push(line);return lines.slice(0,3).map((l,i,a)=>i===2&&lines.length>3?l.slice(0,width-1)+'…':l);}
function render(tree,options={}){
  const key=options.id||'policy',layout=nodesFor(tree),selected=options.selected||'r',path=options.values?route(tree,options.values,options.maxTests??Infinity):{ids:new Set(),edges:new Set()};
  const model=views.get(key)||{scale:options.scale??1,left:null,top:0};model.layout=layout;model.options=options;model.tree=tree;views.set(key,model);
  const chosen=layout.nodes.find(n=>n.id===selected)||layout.nodes[0];
  const rows=options.rows||[];
  const members=new Map(layout.nodes.map(n=>[n.id,[]]));for(const row of rows){const p=route(tree,row.features);for(const id of p.ids)members.get(id)?.push(row.id);}
  const svg=`<svg class="rt-svg" viewBox="0 0 ${layout.width} ${layout.height}" width="${layout.width}" height="${layout.height}" role="group" aria-label="Branching rule tree, ${layout.nodes.length} nodes">
  ${layout.edges.map(e=>{const x1=e.from.x,y1=e.from.y+e.from.h,x2=e.to.x,y2=e.to.y,mid=(y1+y2)/2,on=path.edges.has(e.to.id);return `<g class="rt-edge ${on?'on':''}" data-tree-edge="${e.to.id}" data-branch="${e.value}"><path d="M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}"/><text x="${(x1+x2)/2+(e.value?-5:5)}" y="${mid-6}" text-anchor="${e.value?'end':'start'}">${e.value?'True':'False'}</text></g>`;}).join('')}
  ${layout.nodes.map(n=>{const isLeaf=!n.node.feature,leafLabel=isLeaf?(typeof n.node.prediction==='number'?names[n.node.prediction]:n.node.label||'Unresolved'):'',label=isLeaf?leafLabel:options.shortLabels?.[n.node.feature]||n.node.feature.replaceAll('_',' '),lines=wrap(label),active=path.ids.has(n.id),count=members.get(n.id).length;return `<g class="rt-node ${isLeaf?'leaf '+leafLabel.toLowerCase():'split'} ${active?'on':''} ${n.id===selected?'selected':''}" data-tree-action="select" data-tree-key="${esc(key)}" data-tree-node="${n.id}" role="button" tabindex="0" aria-label="Node ${n.number}: ${esc(label)}${rows.length?'; '+count+' examples':''}"><title>${esc(isLeaf?leafLabel:options.descriptions?.[n.node.feature]||label)}</title><rect x="${n.x-85}" y="${n.y}" width="170" height="${n.h}" rx="${isLeaf?20:10}"/><text class="rt-number" x="${n.x-72}" y="${n.y+16}">${isLeaf?'OUTPUT':'N'+String(n.number).padStart(2,'0')}${rows.length?' · '+count+' examples':''}</text>${lines.map((line,i)=>`<text class="rt-label" x="${n.x}" y="${n.y+(isLeaf?34:34)+i*15}" text-anchor="middle">${esc(line)}</text>`).join('')}</g>`;}).join('')}</svg>`;
  const selectedRows=members.get(chosen.id),desc=chosen.node.feature?options.descriptions?.[chosen.node.feature]||chosen.node.feature:('Output '+(typeof chosen.node.prediction==='number'?names[chosen.node.prediction]:chosen.node.label));
  return `<div class="rt-widget ${Object.values(options.values||{}).includes('unknown')?'uncertain':''}" data-tree-widget="${esc(key)}"><div class="rt-toolbar"><span>True → left &nbsp;·&nbsp; False → right${Object.values(options.values||{}).includes('unknown')?' · dashed paths are admissible alternatives':''}</span><div><button data-tree-action="out" data-tree-key="${esc(key)}" aria-label="Zoom tree out">−</button><button data-tree-action="fit" data-tree-key="${esc(key)}">Fit tree</button><button data-tree-action="actual" data-tree-key="${esc(key)}">100%</button><button data-tree-action="in" data-tree-key="${esc(key)}" aria-label="Zoom tree in">+</button></div></div><div class="rt-viewport" tabindex="0" aria-label="Scrollable tree canvas"><div class="rt-canvas">${svg}</div></div><div class="rt-inspector"><strong>Selected node ${chosen.number} · ${esc(chosen.node.feature?'decision':'output')}</strong><span>${esc(desc)}</span>${chosen.node.feature&&options.values?`<span>Selected case value: <b>${esc(options.values[chosen.node.feature])}</b></span>`:''}${rows.length?`<span>Examples reaching this node: <b>${esc(selectedRows.join(', ')||'none in this fitting batch')}</b></span>`:''}<span class="rt-help">Click a node to inspect it. Scroll to explore branches; zoom keeps text readable.</span></div></div>`;

.stop?'Stop: '+audit.stop+'.':'Click a predicate to inspect its two partitions.'}</p><table class="scoretable"><thead><tr><th>Predicate</th><th>True / false</th><th>Immediate errors</th><th>Recursive result</th></tr></thead><tbody>${audit.candidates.map(p=>`<tr class="${p.feature===S.inspectFeature?'selected':''}"><td>${button(p.feature,'inspect-feature',p.feature,'mode-switch')}</td><td>${p.trueIds.length} / ${p.falseIds.length}</td><td>${p.valid?p.immediateErrors:'—'}</td><td>${!p.valid?p.reason:p.subtreeErrors!=null?p.subtreeErrors+' errors, '+p.subtreeNodes+' nodes':audit.stop?'not searched: '+audit.stop:'not searched after first perfect subtree'}</td></tr>`).join('')}</tbody></table><div class="partition-pair"><div><b>True</b><br>${split.trueIds.join(', ')||'empty'}<br><span class="muted">labels [${split.trueCounts.join(', ')}]</span></div><div><b>False</b><br>${split.falseIds.join(', ')||'empty'}<br><span class="muted">labels [${split.falseCounts.join(', ')}]</span></div></div><p class="small muted">For each branch, majority errors = source count − largest class count. Add the two branches to get immediate errors. Deeper search can improve this estimate.</p></div></div><div class="note amber">Three-source local fits use a toy support floor of 1. Switch to support 2: local batches cannot split. Pooled six-source search at support 2 is checked against the real Python M2 fitter; both learn 6/6 with two decision nodes at depth 2. This tiny corpus cannot certify the real M2 objective.</div><details class="baseline-details"><summary>Compare fixed candidate policies</summary>${candidateButtons()}<div class="rule">${rule(S.candidate)}</div><p class="small">Batch A: ${score(CASES.filter(x=>x.batch==='A'),S.candidate)}/3 · Batch B: ${score(CASES.filter(x=>x.batch==='B'),S.candidate)}/3</p></details>`;
}
function merge() {
  const learned=Search.fit(CASES,{maxDepth:2,minSupport:2}),tree=S.badParent?authoredTree('any'):learned.tree,n=CASES.filter(x=>Search.predict(tree,treeFeatures(x.facts))===x.reference).length;
  return `<div class="row"><h2>Refit the parent on the complete union</h2>${badge('Future hierarchy · illustration','amber')}</div><div class="merge-lineage"><div class="mini-node"><b>Local A</b>A1, A2, A3 · two learned decision nodes</div><span class="arrow">＋</span><div class="mini-node"><b>Local B</b>B1, B2, B3 · two learned decision nodes</div><span class="arrow">→</span><div class="mini-node"><b>Parent candidate</b>All 6 sources · minimum leaf support 2</div></div>${treeDiagram(tree,'parent-tree')}<div class="row">${button(S.badParent?'Restore shared parent':'Try a bad parent','bad-parent',null,'mode-switch')}<div class="score">${n}/6<small>fit on the full union</small></div></div><div class="lineage">${CASES.map(x=>`<span class="source">${x.id}</span>`).join('')}</div><div class="decisionbox amber"><b>${n<6?'Reject this toy candidate: it loses the Partial distinction.':'Fit succeeds; hierarchy acceptance remains pending.'}</b><br>${n<6?'A2 and B2 become false Yes decisions. The children remain available.':'Separate validation sources: 0. Retain the child policies; do not claim a validated replacement.'}</div><p class="demo-boundary">The tree above is an actual in-browser fit on synthetic data. The semantic hierarchy proposal and its acceptance remain illustrative future work.</p>`;
}
function runTree(tree,facts){const keys=['endpoint','progress','material'],unknown=keys.filter(k=>facts[k]==='unknown'),outputs=new Set(),depths=[];for(let mask=0;mask<(1<<unknown.length);mask++){const f={...facts};unknown.forEach((k,i)=>{f[k]=!!(mask&(1<<i));});let node=tree,n=0;while(node.feature){node=node[treeFeatures(f)[node.feature]?'true':'false'];n++;}outputs.add(['no','partial','yes'][node.prediction]);depths.push(n);}return {label:outputs.size===1?[...outputs][0]:'unresolved',possible:[...outputs],depth:Math.max(...depths)};}
function inference() {
  const x=c(),f={...x.facts,...S.overrides},tree=S.inferencePolicy==='guard'?authoredTree():S.frozen.tree,result=runTree(tree,f),walk=Math.min(S.walk??result.depth,result.depth);
  return `<div class="row"><h2>${x.id} · Frozen decision tree</h2>${badge('Reference hidden')}</div><div class="inference-model">${button('Learned from six','inference-model','learned',S.inferencePolicy==='learned'?'selected':'')}${button('Authored collateral guard','inference-model','guard',S.inferencePolicy==='guard'?'selected':'')}</div><p class="small muted">${S.inferencePolicy==='learned'?('Frozen from '+S.frozen.fitIds.join(', ')+': depth '+S.frozen.settings.maxDepth+', minimum support '+S.frozen.settings.minSupport+'.'):'An authored comparison tree. Its extra collateral rule was not learned from the six examples.'}</p><div class="tree-advance">${button('Start at root','walk-reset')}${button('Next branch →','walk-next')}${button('Show result','walk-all')}<span class="readout">${walk}/${result.depth} tests followed</span></div>${treeDiagram(tree,'execute-tree',CASES,treeFeatures(f),walk)}${walk>=result.depth?`<div class="result ${result.label}"><div><span class="small">Output from evidence only</span><br><strong>${cap(result.label)}</strong></div><span class="small">No fitting on this input<br>No model call</span></div>`:`<div class="decisionbox">Decision pending. Follow the highlighted branches to an output leaf.</div>`}${result.label==='unresolved'&&walk>=result.depth?`<p class="path">Admissible evidence can produce: ${result.possible.map(cap).join(' or ')}. Preserve Unresolved.</p>`:''}<div class="featurecontrols"><div class="row"><span class="eyebrow">Synthetic evidence controls</span>${button('Restore facts','reset-facts',null,'mode-switch')}</div>${[['endpoint','Requested endpoint reached'],['progress','Goal-directed progress established'],['material','Material unrequested change']].map(([key,text])=>`<label>${text}<select data-feature="${key}" aria-label="${text}">${['true','false','unknown'].map(v=>`<option value="${v}" ${String(f[key])===v?'selected':''}>${cap(v)}</option>`).join('')}</select></label>`).join('')}</div><div class="note">All six fitting scenes preserve the plant. The learner therefore cannot learn a material-collateral distinction from them. Changing that feature leaves the learned prediction unchanged; the authored guard shows a different, explicitly supplied rule.</div>`;
}
function results() {const frozen=S.frozen.tree;return `<div class="row"><h2>All six, through the frozen teaching rule</h2>${badge('Synthetic same-example replay','amber')}</div><table class="scoretable"><thead><tr><th>Case</th><th>Endpoint</th><th>Progress</th><th>Prediction</th><th>Reference</th></tr></thead><tbody>${CASES.map(x=>`<tr><td>${button(x.id,'case',CASES.indexOf(x),'mode-switch')}</td><td>${x.facts.endpoint}</td><td>${x.facts.progress}</td><td>${resultBadge(Search.predict(frozen,x.facts))}</td><td data-reference="${x.id}">${resultBadge(x.reference)}</td></tr>`).join('')}</tbody></table><div class="result"><div class="score">${CASES.filter(x=>Search.predict(frozen,x.facts)===x.reference).length}/6<small>invented fitting examples matched</small></div><div class="small muted">No new test examples<br>No real benchmark claim</div></div><p class="demo-boundary">The actual reviewed M2 uses 14 rules and scores 44/48 locally. Open the full research demo for real records, exact policy traces, support examples, and audits.</p>`;}
const pages=[examples,compile,observe,abstract,fit,merge,inference,results];
function render() {
  const step=STEPS[S.step];
  app.innerHTML=`<header class="topbar"><div><span class="brand">CaliTree / six cases</span><span class="sub">The algorithm, without the research detail</span></div><div class="toptools">${badge('Synthetic teaching model','amber')}<a href="calitree-demo.html">Full research demo ↗</a>${button(S.notes?'Hide notes':'Speaker notes','notes')}</div></header><div class="wrap"><div class="heading"><div><div class="eyebrow">${String(S.step+1).padStart(2,'0')} / 08 · ${step.name}</div><h1>${step.title}</h1><p class="lead">${step.lead}</p></div>${button(S.playing?'Pause walkthrough':'Play walkthrough','play',null,S.playing?'':'primary')}</div><nav class="steps" aria-label="Algorithm steps">${STEPS.map((x,i)=>`<button class="step ${i===S.step?'active':i<S.step?'done':''}" data-action="step" data-value="${i}" ${i===S.step?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${x.name}</button>`).join('')}</nav><div class="quick-cases"><span>Follow a case</span>${CASES.map((x,i)=>button(x.id,'case',i,i===S.index?'selected':'')).join('')}</div><div class="layout ${S.step===4?'algorithm-layout':''}"><section class="visual" aria-live="polite">${pages[S.step]()}</section><aside class="explain"><div class="eyebrow">The idea to explain</div><p class="say">${step.say}</p><div class="inputoutput"><div><label>What goes in</label><p>${step.input}</p></div><div><label>What comes out</label><p>${step.output}</p></div></div><div class="note ${[0,4,5,7].includes(S.step)?'amber':''}">${step.note}</div>${S.notes?`<div class="speaker"><div class="eyebrow">Speaker note</div><p style="margin-top:8px">${step.speaker}</p></div>`:''}</aside></div><div class="galleryhead"><span>Keep all six examples in view · click to follow one</span><span>Batch A: recolor &nbsp; / &nbsp; Batch B: remove</span></div><div class="cases">${CASES.map((x,i)=>`<button class="case ${i===S.index?'active':''}" data-action="case" data-value="${i}" aria-label="${x.id} ${x.name}"><b>${x.id}</b><span class="name">${x.name}</span>${scene(x.edit,x.id+' preview')}<span class="ref-label">${S.step===6?'Inference':'Reference'}</span>${S.step===6?'<span class="empty-ref">hidden</span>':`<span data-reference="${x.id}">${resultBadge(x.reference)}</span>`}</button>`).join('')}</div><footer class="footer"><button data-action="prev" ${S.step===0?'disabled':''}>← Back</button><span class="caption">← → steps &nbsp;·&nbsp; [ ] cases &nbsp;·&nbsp; N notes &nbsp;·&nbsp; all local, no API calls</span><div class="footbuttons">${S.step===7?button('Start again','restart'):''}<button class="primary" data-action="next" ${S.step===7?'disabled':''}>Next step →</button></div></footer></div>`;
  Tree.mount(app);
}
function stop(){clearInterval(timer);timer=null;S.playing=false;}
function go(step,manual=true){if(manual)stop();S.step=Math.min(7,Math.max(0,Number(step)));S.overrides={};S.walk=null;render();}
app.addEventListener('click',e=>{
  const b=e.target.closest('button[data-action]');if(!b)return;
  switch(b.dataset.action){
    case 'step':go(b.dataset.value);break;
    case 'prev':go(S.step-1);break;
    case 'next':go(S.step+1);break;
    case 'case':S.index=Number(b.dataset.value);S.overrides={};S.walk=null;render();break;
    case 'freeze-candidate':{const rows=learningRows(),report=Search.fit(rows,{maxDepth:S.depth,minSupport:S.minSupport});S.frozen=freezeArtifact(report.tree,rows.map(x=>x.id),{maxDepth:S.depth,minSupport:S.minSupport});S.inferencePolicy='learned';S.treeNodes['execute-tree']='r';go(6);S.walk=0;render();break;}
    case 'inspect-feature':S.inspectFeature=b.dataset.value;render();break;
    case 'grow-reset':S.grow=0;S.learnNode='r';S.treeNodes['learn-tree']='r';render();break;
    case 'grow-next':S.grow=Math.min(Search.fit(learningRows(),{maxDepth:S.depth,minSupport:S.minSupport}).decisions.length,(S.grow??0)+1);render();break;
    case 'grow-all':S.grow=null;render();break;
    case 'walk-reset':S.walk=0;render();break;
    case 'walk-next':S.walk=(S.walk??0)+1;render();break;
    case 'walk-all':S.walk=null;render();break;
    case 'inference-model':S.inferencePolicy=b.dataset.value;S.walk=null;S.treeNodes['execute-tree']='r';render();break;
    case 'candidate':S.candidate=b.dataset.value;render();break;
    case 'bad-parent':S.badParent=!S.badParent;render();break;
    case 'reset-facts':S.overrides={};render();break;
    case 'notes':S.notes=!S.notes;render();break;
    case 'restart':S.index=0;S.candidate='shared';S.badParent=false;go(0);break;
    case 'play':if(S.playing){stop();render();break;}if(S.step===7)S.step=0;S.playing=true;render();timer=setInterval(()=>{if(S.step===7){stop();render();return;}go(S.step+1,false);if(S.step===7){stop();render();}},4000);break;
  }
});
app.addEventListener('change',e=>{
  if(e.target.matches('select[data-feature]')){const value=e.target.value;S.overrides[e.target.dataset.feature]=value==='unknown'?value:value==='true';S.walk=null;render();}
  if(e.target.id==='learn-batch'||e.target.id==='learn-depth'||e.target.id==='learn-support'){
    if(e.target.id==='learn-batch')S.batch=e.target.value;
    if(e.target.id==='learn-depth')S.depth=Number(e.target.value);
    if(e.target.id==='learn-support')S.minSupport=Number(e.target.value);
    S.grow=null;S.learnNode='r';S.treeNodes['learn-tree']='r';render();
  }
});
Tree.bind(app,(key,id)=>{S.treeNodes[key]=id;if(key==='learn-tree')S.learnNode=id;render();});
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea,[data-tree-widget]')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(S.step+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(S.step-1);}if(e.key==='['||e.key===']'){e.preventDefault();S.index=(S.index+(e.key===']'?1:5))%6;S.overrides={};S.walk=null;render();}if(e.key.toLowerCase()==='n'){S.notes=!S.notes;render();}});
window.CaliTreeSix=Object.freeze({cases:CASES,predict,score,checks,runTree,authoredTree,getFrozen:()=>S.frozen});
render();
})();
</script></body>
